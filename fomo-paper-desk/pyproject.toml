[project]
name = "fomo-paper-desk"
version = "0.2.0"
description = "Private FOMO paper trading-desk backend. No live orders."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
webpush = ["pywebpush>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["desk*"]

[tool.setuptools.package-data]
desk = ["static/*.html", "static/*.css", "static/*.js"]
